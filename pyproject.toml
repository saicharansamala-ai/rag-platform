[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "production-rag-platform"
version = "0.1.0"
description = "Production-oriented multi-format RAG platform"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"